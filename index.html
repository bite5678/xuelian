<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=0.5, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
<title>雪莲-用户管理系统</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0b0d; --surface: #111318; --surface2: #181c24; --border: #252c3a; 
    --accent: #f0a500; --text: #e8ecf4; --text3: #4a5568; --danger: #ff4757; 
    --success: #2ed573; --warning: #ffa502; --unused: #a78bfa;
    --success: #2ed573; /* 绿色 */
  }
/* 统计卡片中“有效”数字改为绿色 */
.stat-card .stat-value[style*="color:var(--active)"] {
    color: var(--success) !important;
}
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: 'JetBrains Mono', 'Microsoft YaHei', sans-serif; background: var(--bg); color: var(--text); padding-bottom: 80px; overflow-y: scroll; }
  
  .header { position:sticky; top:0; z-index:100; width:calc(100% - 48px); max-width:1200px; margin:0 auto; background: rgba(10,11,13,0.9); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); padding: 10px 20px; display:flex; align-items:center; justify-content:space-between; }
  .logo { font-family:'Syne',sans-serif; font-weight:800; color: var(--accent); font-size: 1.2rem; }
  .sync-info { font-size: 10px; color: var(--text3); margin-left: 10px; }

  .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: var(--success); color: #000; padding: 8px 20px; border-radius: 4px; font-weight: bold; font-size: 12px; z-index: 9999; opacity: 0; transition: opacity 0.3s, transform 0.3s; pointer-events: none; box-shadow: 0 4px 15px rgba(46, 213, 115, 0.4); }
  .toast.show { opacity: 1; transform: translate(-50%, 10px); }

  .stats-bar { display:grid; grid-template-columns:repeat(5, 1fr); gap:10px; padding:20px; width:calc(100% - 48px); max-width:1200px; margin:0 auto; }
  .stat-card { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:10px; cursor:pointer; transition: 0.2s; }
  .stat-card.active { border: 2px solid var(--accent); background: var(--surface2); }
  .stat-label { font-size:10px; color:var(--text3); }
  .stat-value { font-family:'Syne',sans-serif; font-size:18px; font-weight: 800; }

  .unused-container { width:calc(100% - 48px); max-width:1200px; margin:0 auto 20px; padding:0 20px; }
  .unused-box { background: rgba(167, 139, 250, 0.05); border: 1px dashed var(--unused); border-radius: 8px; padding: 12px; }
  .unused-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .unused-item { background: var(--surface2); border: 1px solid var(--border); padding: 3px 8px; border-radius: 4px; font-size: 11px; display: flex; align-items: center; gap: 6px; }

  .main-content { width:calc(100% - 48px); max-width:1200px; margin:0 auto; padding:0 20px; }
  .table-wrap { background:var(--surface); border:1px solid var(--border); border-radius:8px; overflow-x:auto; -webkit-overflow-scrolling:touch; touch-action:pan-x pan-y pinch-zoom; }
  table { width:max-content; border-collapse:collapse; table-layout:auto; }
  .user-table { width:100%; min-width:895px; table-layout:auto; }
  th { background:var(--surface2); color:#90ee90; font-size:11px; padding:12px 14px; text-align:left; border-bottom:1px solid var(--border); white-space:nowrap; }
  
  td { padding:10px 14px; font-size:13px; border-bottom:1px solid var(--border); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .header-stat { color: var(--accent); font-weight: 800; margin-left: 4px; }
  .editable { cursor: pointer; border-bottom: 1px dashed #444; position: relative; }
  .editable:hover { background: rgba(240,165,0,0.05); color: var(--accent); }
  
  .edit-input { background: #000; border: 1px solid var(--accent); color: #fff; width: 100%; padding: 4px; border-radius: 4px; font-family: inherit; outline: none; }
  .col-filter { display:block; width:100%; background:#000; border:1px solid var(--border); border-radius:4px; color:var(--text); font-size:10px; padding:3px; margin-top:5px; box-sizing:border-box; }
  
  .btn { padding: 6px 12px; border-radius:4px; border:none; cursor:pointer; font-size:11px; font-weight:600; display:inline-flex; align-items:center; justify-content: center; gap:4px; }
  .btn-sm { padding: 4px 8px; font-size: 10px; }
  .btn-success { background:var(--success); color:#000; }
  .btn-ghost { background:transparent; color:var(--text); border:1px solid var(--border); }
  .btn-danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
  .btn-danger:hover { background: var(--danger); color: #fff; }
  .row-actions { text-align:center; white-space:nowrap; }
  
  .star-btn { cursor: pointer; font-size: 16px; color: var(--text3); transition: 0.2s; margin-right: 5px; vertical-align: middle; }
  .star-btn.active { color: var(--warning); text-shadow: 0 0 8px rgba(255,165,2,0.5); }

  .trash-drawer { position: fixed; right: -500px; top: 0; width: 500px; max-width: 95vw; height: 100%; background: var(--surface); border-left: 1px solid var(--border); transition: 0.3s; z-index: 101; padding: 20px; box-shadow: -10px 0 30px rgba(0,0,0,0.8); display: flex; flex-direction: column; }
  .trash-drawer.open { right: 0; }
  .trash-list-wrap { flex: 1; overflow-y: auto; margin-top: 10px; }
  .trash-row { display:grid; grid-template-columns:1.5fr 1fr 1fr .8fr 66px; align-items:center; background:var(--surface2); border:1px solid var(--border); padding:8px 12px; border-radius:6px; margin-bottom:6px; font-size:11px; gap:8px; }
  .trash-header { display:grid; grid-template-columns:1.5fr 1fr 1fr .8fr 66px; padding:0 12px 8px; color:var(--text3); font-size:10px; gap:8px; }
  
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; z-index: 100; backdrop-filter: blur(2px); }
  .overlay.open { display: block; }
  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.8); display:none; align-items:center; justify-content:center; z-index:1000; }
  .modal-overlay.open { display:flex; }
  .modal { background:var(--surface); padding:20px; border-radius:8px; border:1px solid var(--border); }
  .bit-link-btn { border-color:#3b82f6; color:#93c5fd; min-width:126px; white-space:nowrap; }
  .bit-link-btn.ok { border-color:var(--success); color:var(--success); }
  .bit-link-btn.warn { border-color:var(--warning); color:var(--warning); }
  .bit-link-btn.error { border-color:var(--danger); color:var(--danger); }
  .bit-modal { width:min(980px, 96vw); max-height:90vh; display:flex; flex-direction:column; }
  .bit-route-list { display:flex; flex-wrap:wrap; gap:8px; margin:10px 0 14px; }
  .bit-route { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:9px 12px; font-size:13px; line-height:1.5; }
  .bit-route.online { border-color:var(--success); }
  .bit-route.offline { border-color:var(--danger); }
  .bit-job-toolbar { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:8px; }
  .bit-job-title { font-size:13px; color:#90ee90; font-weight:bold; white-space:nowrap; }
  .bit-job-count { color:#fff; font-size:11px; font-weight:normal; }
  .bit-job-search { width:260px; max-width:48%; background:#000; border:1px solid var(--border); border-radius:5px; color:#fff; font-size:13px; padding:7px 10px; outline:none; }
  .bit-job-search:focus { border-color:var(--accent); }
  .bit-job-list { overflow-y:auto; overflow-x:hidden; min-height:180px; border:1px solid var(--border); border-radius:6px; }
  .bit-job-row { display:grid; grid-template-columns:minmax(0,1.05fr) minmax(0,1fr) minmax(0,1.12fr) minmax(0,.8fr) minmax(0,1.15fr) minmax(38px,.45fr) minmax(0,1.55fr) minmax(44px,.55fr); width:100%; min-width:0; gap:7px; align-items:center; padding:10px; border-bottom:1px solid var(--border); font-size:12px; line-height:1.35; }
  .bit-job-row.bit-job-header { position:sticky; top:0; background:var(--surface2); color:#90ee90; z-index:1; }
  .bit-job-row > div { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .bit-job-message { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:#fff; }
  .bit-badge { display:inline-block; padding:2px 6px; border-radius:8px; border:1px solid var(--border); font-size:11px; }
  .bit-badge.success, .bit-badge.resolved { color:var(--success); border-color:var(--success); }
  .bit-badge.pending, .bit-badge.processing, .bit-badge.retry_wait, .bit-badge.routing_required { color:var(--warning); border-color:var(--warning); }
  .bit-badge.needs_attention { color:var(--danger); border-color:var(--danger); }
  .operation-log-btn { border-color:var(--unused); color:#c4b5fd; min-width:104px; }
  .operation-modal { width:min(1050px, 96vw); max-height:90vh; display:flex; flex-direction:column; }
  .operation-log-list { overflow:auto; min-height:220px; border:1px solid var(--border); border-radius:6px; }
  .operation-log-row { display:grid; grid-template-columns:145px 95px 165px 105px 105px 110px; gap:9px; align-items:center; min-width:790px; padding:10px 12px; border-bottom:1px solid var(--border); font-size:12px; line-height:1.35; }
  .operation-log-row.operation-log-header { position:sticky; top:0; background:var(--surface2); color:#90ee90; z-index:1; }
  .operation-log-row > div:nth-child(2) { font-size:13px; }
  .loading-mask { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 9999; display: none; align-items: center; justify-content: center; color: var(--accent); font-weight: bold; }
  .loading-mask.nonblocking { inset:9px auto auto 50%; transform:translateX(-50%); padding:8px 14px; border:1px solid var(--border); border-radius:6px; background:rgba(10,11,13,.92); pointer-events:none; font-size:12px; white-space:nowrap; }

  @media (max-width:720px) {
    html, body { width:100%; max-width:100%; min-width:0; overflow-x:hidden; }
    .header { width:100%; max-width:100vw; padding:10px 8px; gap:8px; overflow:hidden; }
    .header > div:first-child { min-width:0; overflow:hidden; }
    .header > div:last-child { min-width:0; overflow-x:auto; }
    .logo { font-size:1rem; white-space:nowrap; }
    .sync-info { display:inline-block; max-width:80px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .header .btn { padding:5px 7px; font-size:9px; white-space:nowrap; }
    .stats-bar, .unused-container, .main-content { width:100%; max-width:100%; padding-left:8px; padding-right:8px; }
    .stats-bar { gap:4px; grid-template-columns:repeat(5,minmax(0,1fr)); }
    .stat-card { min-width:0; padding:7px 5px; }
    .stat-label { font-size:8px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .stat-value { font-size:16px; }
    .unused-list { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:4px; }
    .unused-item { min-width:0; padding:3px; gap:2px; font-size:9px; overflow:hidden; }
    .unused-item span { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .table-wrap { width:100%; max-width:100%; overflow-x:auto; }
    .user-table { width:max-content; min-width:895px; }
    th { padding:10px 8px; }
    td { padding:9px 8px; }
    .trash-drawer { right:-100vw; width:100vw; max-width:100vw; padding:12px 8px; }
    .trash-row, .trash-header { grid-template-columns:minmax(88px,1.3fr) minmax(75px,1fr) 72px 55px 54px; gap:4px; }
    .trash-row .btn { padding:3px 6px; font-size:9px; }
  }
</style>
</head>
<body>

<div class="toast" id="toastMsg">已复制</div>
<div class="loading-mask" id="loadingMask">☁️ Supabase 同步中...</div>

<header class="header">
  <div style="display:flex; align-items:center">
    <div class="logo">⚡ 雪莲-用户管理系统</div>
    <span class="sync-info" id="syncStatus">连接中...</span>
  </div>
  <div style="display:flex; gap:8px;">
    <button class="btn btn-ghost" onclick="syncFromCloud()">🔄 强制刷新</button>
    <button class="btn btn-ghost bit-link-btn" id="bitLinkButton" onclick="openBitLinkModal()">🔗 联动检测中</button>
    <button class="btn btn-ghost operation-log-btn" id="operationLogButton" onclick="openOperationLogModal()">📝 操作日志</button>
    <button class="btn btn-ghost" onclick="toggleTrash(true)">🗑️ 回收站 (<span id="trashCount">0</span>)</button>
  </div>
</header>

<div class="stats-bar" id="statsBar"></div>

<div class="unused-container">
  <div class="unused-box">
    <div style="font-size: 11px; color: var(--unused); font-weight: bold;">🔑 待激活名额</div>
    <div class="unused-list" id="unusedGrid"></div>
  </div>
</div>

<main class="main-content">
  <div class="table-wrap">
    <table class="user-table">
      <thead>
        <tr>
          <th width="90">归属</th>
          <th width="70">窗口 <span class="header-stat" id="statWindows">/ 0</span><input type="text" class="col-filter" data-col="windows" oninput="render()"></th>
          <th width="110">用户 <span class="header-stat" id="statUsers">/ 0</span><input type="text" class="col-filter" data-col="username" oninput="render()"></th>
          <th width="95">密码<input type="text" class="col-filter" data-col="password" oninput="render()"></th>
          <th width="100">微信<input type="text" class="col-filter" data-col="wechat" oninput="render()"></th>
          <th width="100">激活时间<input type="text" class="col-filter" data-col="activeTime" oninput="render()"></th>
          <th width="100">到期日期<input type="text" class="col-filter" data-col="expiry" oninput="render()"></th>
          <th width="70">金额 <span class="header-stat" id="statAmount">/ 0</span><input type="text" class="col-filter" data-col="amount" oninput="render()"></th>
          <th width="80">状态</th>
          <th width="80" style="text-align:center">操作</th>
        </tr>
      </thead>
      <tbody id="userTableBody"></tbody>
    </table>
  </div>
</main>

<div class="overlay" id="overlay" onclick="toggleTrash(false)"></div>
<div class="trash-drawer" id="trashDrawer">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px">
    <h3 style="color:var(--danger)">🗑️ 回收站 (可续费恢复)</h3>
    <button class="btn btn-ghost" onclick="toggleTrash(false)">关闭</button>
  </div>
  <div class="trash-header">
    <div>用户名</div><div>微信</div><div>到期(月日)</div><div>金额</div><div>操作</div>
  </div>
  <div class="trash-list-wrap" id="trashList"></div>
</div>

<div class="modal-overlay" id="bitLinkModal" onclick="if(event.target===this)this.classList.remove('open')">
  <div class="modal bit-modal">
    <div style="display:flex; justify-content:space-between; align-items:center; gap:12px;">
      <div>
        <h3 style="font-size:17px; color:#93c5fd;">🔗 BitBrowser 联动状态</h3>
        <div id="bitLinkSummary" style="font-size:12px; color:#fff; margin-top:5px;">正在读取联动状态...</div>
      </div>
      <div style="display:flex; gap:8px;">
        <button class="btn btn-ghost" onclick="refreshBitLinkData()">立即刷新</button>
        <button class="btn btn-ghost" onclick="closeBitLinkModal()">关闭</button>
      </div>
    </div>
    <div id="bitRouteList" class="bit-route-list"></div>
    <div class="bit-job-toolbar">
      <div class="bit-job-title">最近联动任务 <span class="bit-job-count" id="bitJobSearchCount"></span></div>
      <input type="text" id="bitJobSearchInput" class="bit-job-search" placeholder="🔍 全局搜索：员工号 / 微信 / 动作 / 日期 / 结果..." autocomplete="off" oninput="renderBitIntegration()">
    </div>
    <div id="bitJobList" class="bit-job-list"></div>
    <div style="font-size:12px; color:#fff; margin-top:10px; line-height:1.6;">
      联动状态每5秒刷新；本页仅显示当前归属的员工号任务。
    </div>
  </div>
</div>

<div class="modal-overlay" id="operationLogModal" onclick="if(event.target===this)this.classList.remove('open')">
  <div class="modal operation-modal">
    <div style="display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:12px;">
      <div>
        <h3 style="font-size:17px; color:#c4b5fd;">📝 操作日志</h3>
        <div style="font-size:12px; color:#fff; margin-top:5px;">仅记录从本功能上线后的激活和续费操作，不回填历史。</div>
      </div>
      <button class="btn btn-ghost" onclick="closeOperationLogModal()">关闭</button>
    </div>
    <div class="bit-job-toolbar">
      <div class="bit-job-title">激活 / 续费 <span class="bit-job-count" id="operationLogSearchCount"></span></div>
      <input type="text" id="operationLogSearchInput" class="bit-job-search" placeholder="🔍 全局搜索：员工号 / 激活 / 续费 / 日期..." autocomplete="off" oninput="renderOperationLogs()">
    </div>
    <div id="operationLogList" class="operation-log-list"></div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://xlmnfzocrlqvbzzrdshr.supabase.co'; 
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhsbW5mem9jcmxxdmJ6enJkc2hyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ5ODMyMjAsImV4cCI6MjA5MDU1OTIyMH0.Pvhl7JTz-FmOZ6J_aT8kBRve3ZrjOIIVVekr4jTZXUM';
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const STORAGE_KEY = 'uf_v45_db';
const ROW_ID = 1; 

const DEFAULT_WINDOWS = '100';
const DEFAULT_AMOUNT = '32';
const DEFAULT_PWD = '123456';
const TARGET_ORG = '雪莲';
const BIT_CONNECTOR_OFFLINE_MS = 60000;
const BIT_WINDOW_QUOTA_ACTION = 'set_window_quota';
const BIT_WINDOW_ACTIVE_STATUSES = new Set(['routing_required','pending','processing','retry_wait','needs_attention']);
const BIT_PENDING_STATUSES = new Set(['routing_required','pending','processing','retry_wait']);
const BIT_STATUS_LABELS = {
    routing_required:'等待前缀路由', pending:'待执行', processing:'执行中', retry_wait:'等待重试',
    success:'已完成', needs_attention:'需人工处理', resolved:'已解决', cancelled:'已取消'
};
const BIT_ACTION_LABELS = {
    disable:'停用员工号', enable:'启用员工号', recover:'恢复员工号', delete:'删除员工号', set_window_quota:'修改窗口数'
};
const BIT_RESULT_LABELS = {
    deleted:'已删除', recovered:'已恢复', disabled:'已停用', enabled:'已启用', window_quota_updated:'窗口数已更新',
    cancelled_by_user:'用户已取消', resolved_by_newer_task:'已被较新任务解决',
    superseded_by_newer_task:'已被较新任务替代', window_quota_cancelled_by_delete:'删除员工号时已取消窗口数任务'
};
const OPERATION_ACTION_LABELS = { activate:'激活', renew:'续费' };

let db = { users: [], unused: [], trash: [], bitTasks: [], bitConnectors: [], bitInventory: [], bitUsernameRegistry: [], operationLogs: [] };
let currentFilter = 'all';
let newlyActivatedId = null;
let _isSaving = false;      // 保存锁，防止并发覆盖
let _saveTimer = null;      // 防抖定时器
let _hasPendingSave = false;// 是否有尚未提交的本地修改
let _isSilentSave = false;
let _saveRetryTimer = null;
let _saveRevision = 0;
let _isSyncing = false;
let _isSyncingConnectors = false;
let connectorHeartbeatById = new Map();
let activeConnectors = [];
let bitConnectorRoutes = [];
let bitIntegrationAvailable = null;
let bitIntegrationMessage = '正在读取联动状态';
let baseSnapshot = null;
let lastKnownUpdatedAt = null; // 【乐观锁】云端最后的时间戳版本

function normalizeDb(content) {
    if (typeof content === 'string') {
        try { content = JSON.parse(content); } catch (e) { content = {}; }
    }
    const value = content && typeof content === 'object' ? content : {};
    return {
        ...value,
        users: Array.isArray(value.users) ? value.users : [],
        unused: Array.isArray(value.unused) ? value.unused : [],
        trash: Array.isArray(value.trash) ? value.trash : [],
        bitTasks: Array.isArray(value.bitTasks) ? value.bitTasks : [],
        bitConnectors: Array.isArray(value.bitConnectors) ? value.bitConnectors : [],
        bitInventory: Array.isArray(value.bitInventory) ? value.bitInventory : [],
        bitUsernameRegistry: Array.isArray(value.bitUsernameRegistry) ? value.bitUsernameRegistry : [],
        operationLogs: Array.isArray(value.operationLogs) ? value.operationLogs : []
    };
}

function buildMainDataPayload() {
    return {
        users: db.users,
        unused: db.unused,
        trash: db.trash,
        bitTasks: db.bitTasks || [],
        bitConnectors: db.bitConnectors || [],
        bitInventory: db.bitInventory || [],
        bitUsernameRegistry: db.bitUsernameRegistry || [],
        operationLogs: db.operationLogs || []
    };
}

function snapshotMainData(payload = buildMainDataPayload()) {
    return JSON.parse(JSON.stringify(payload));
}

function scheduleCloudSave(delay = 500) {
    clearTimeout(_saveTimer);
    _saveTimer = setTimeout(() => _doSaveToCloud(), delay);
}

function getBeijingTime() {
    const now = new Date();
    const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
    return new Date(utc + (3600000 * 8));
}

function getStatus(dateStr) {
    if (!dateStr || dateStr === '-') return 'expired';
    const targetDate = new Date(dateStr);
    targetDate.setHours(0, 0, 0, 0);
    const today = getBeijingTime();
    today.setHours(0, 0, 0, 0);
    const diffDays = Math.ceil((targetDate - today) / 86400000);
    if (diffDays < 0) return 'expired';
    if (diffDays <= 3) return 'expiring';
    return 'active';
}

function newLocalTaskId() {
    if (globalThis.crypto && typeof globalThis.crypto.randomUUID === 'function') return globalThis.crypto.randomUUID();
    return `local-${Date.now()}-${Math.random().toString(16).slice(2)}`;
}

function enqueueWindowQuotaTask(record, targetWindowCount) {
    if (!Array.isArray(db.bitTasks)) db.bitTasks = [];
    const current = db.bitTasks.find(task => String(task.id) === String(record.windowJobId || ''));
    if (current && BIT_WINDOW_ACTIVE_STATUSES.has(String(current.status || '')) && Number(current.targetWindowCount) === targetWindowCount) return current;
    const now = new Date().toISOString();
    const inventory = (db.bitInventory || []).find(item =>
        item?.present !== false && String(item.usernameNorm || item.username || '').trim().toLowerCase() === String(record.username || '').trim().toLowerCase()
    );
    const task = {
        id: newLocalTaskId(),
        dedupeKey: `window-quota:${record.id}:${targetWindowCount}:${Date.now()}`,
        sourceRecordId: String(record.id || ''),
        username: String(record.username || ''),
        action: BIT_WINDOW_QUOTA_ACTION,
        status: 'routing_required',
        targetConnectorId: null,
        targetPrefix: null,
        bitUserId: inventory?.bitUserId || null,
        targetWindowCount,
        attempts: 0,
        nextRetryAt: now,
        claimedBy: null,
        claimUntil: null,
        resultCode: '',
        lastError: '等待连接器按账号前缀领取任务。',
        createdAt: now,
        updatedAt: now,
        completedAt: null
    };
    db.bitTasks.unshift(task);
    record.windowJobId = task.id;
    record.windowTarget = targetWindowCount;
    record.windowSyncAction = BIT_WINDOW_QUOTA_ACTION;
    record.windowSyncStatus = task.status;
    record.windowSyncMessage = task.lastError;
    record.windowSyncUpdatedAt = now;
    return task;
}

function enqueueRestrictedLifecycleTask(record, action) {
    if (!['recover', 'disable'].includes(action)) throw new Error('不支持的员工号状态任务。');
    if (!Array.isArray(db.bitTasks)) db.bitTasks = [];
    const now = new Date().toISOString();
    const inventory = (db.bitInventory || []).find(item =>
        item?.present !== false && String(item.usernameNorm || item.username || '').trim().toLowerCase() === String(record.username || '').trim().toLowerCase()
    );
    const task = {
        id:newLocalTaskId(),
        dedupeKey:`${action}:${record.id}:${Date.now()}`,
        sourceRecordId:String(record.id || ''),
        sourceOwner:String(record.owner || ''),
        username:String(record.username || ''),
        action,
        status:'routing_required',
        targetConnectorId:null,
        targetPrefix:null,
        bitUserId:inventory?.bitUserId || null,
        targetWindowCount:null,
        attempts:0,
        nextRetryAt:now,
        claimedBy:null,
        claimUntil:null,
        resultCode:'',
        lastError:'等待连接器按账号前缀领取任务。',
        createdAt:now,
        updatedAt:now,
        completedAt:null
    };
    db.bitTasks.unshift(task);
    record.bitJobId=task.id;
    record.bitSyncAction=action;
    record.bitSyncStatus=task.status;
    record.bitSyncMessage=task.lastError;

}

function renewedExpiryForTrash(record) {
    let base = new Date(record?.expiry || '');
    const now = getBeijingTime();
    if (Number.isNaN(base.getTime()) || base < now) base = now;
    base.setDate(base.getDate() + 30);
    return base.toISOString().slice(0,10);
}

function isTargetOwnerRecord(record) {
    return String(record?.owner || '').trim() === TARGET_ORG;
}

function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>"']/g, char => ({
        '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
    })[char]);
}

function findBitTaskSourceRecord(task, state = db) {
    const sourceId = String(task?.sourceRecordId || task?.source_record_id || '');
    const username = String(task?.username || '').trim().toLowerCase();
    if (sourceId) {
        for (const listName of ['users','unused','trash']) {
            const record = (state[listName] || []).find(item => String(item?.id || '') === sourceId);
            if (record) return record;
        }
    }
    if (username) {
        for (const listName of ['users','unused','trash']) {
            const record = (state[listName] || []).find(item =>
                String(item?.username || '').trim().toLowerCase() === username
            );
            if (record) return record;
        }
    }
    return null;
}

function isBitTaskInTargetScope(task, state = db) {
    const sourceOwner = String(task?.sourceOwner || task?.source_owner || task?.recordSnapshot?.owner || '').trim();
    if (sourceOwner) return sourceOwner === TARGET_ORG;
    const record = findBitTaskSourceRecord(task, state);
    return Boolean(record && isTargetOwnerRecord(record));
}

function operationLogsInScope() {
    return (db.operationLogs || []).filter(log => String(log?.owner || '').trim() === TARGET_ORG);
}

function recordOperationLog(record, action, details = {}) {
    if (!record || !OPERATION_ACTION_LABELS[action]) return null;
    if (!Array.isArray(db.operationLogs)) db.operationLogs = [];
    const log = {
        id:newLocalTaskId(), sourceRecordId:String(record.id || ''), username:String(record.username || ''),
        owner:String(record.owner || TARGET_ORG), action,
        activeDate:String(record.activeTime || details.activeDate || ''),
        operatedAt:String(details.operatedAt || new Date().toISOString()),
        expiryBefore:String(details.expiryBefore || ''),
        expiryAfter:String(details.expiryAfter || record.expiry || '')
    };
    db.operationLogs.unshift(log);
    return log;
}

function latestRenewLogForTask(task, record) {
    const sourceId = String(task?.sourceRecordId || task?.source_record_id || record?.id || '');
    const username = String(task?.username || record?.username || '').trim().toLowerCase();
    return [...operationLogsInScope()]
        .filter(log => String(log?.action || '') === 'renew')
        .filter(log => (sourceId && String(log?.sourceRecordId || '') === sourceId) ||
            (username && String(log?.username || '').trim().toLowerCase() === username))
        .sort((a,b) => String(b.operatedAt || '').localeCompare(String(a.operatedAt || '')))[0] || null;
}

function localizeBitResultText(value) {
    const text = String(value || '').trim();
    if (!text) return '-';
    const direct = BIT_RESULT_LABELS[text.toLowerCase()];
    if (direct) return direct;
    return text.replace(/\b(deleted|recovered|disabled|enabled|window_quota_updated|cancelled_by_user|resolved_by_newer_task|superseded_by_newer_task|window_quota_cancelled_by_delete)\b/gi,
        code => BIT_RESULT_LABELS[code.toLowerCase()] || code);
}

function bitResultText(task) {
    const error = String(task?.lastError || task?.last_error || '').trim();
    if (error) return localizeBitResultText(error);
    return localizeBitResultText(task?.resultCode || task?.result_code || '');
}

function formatOperationTime(value) {
    if (!value) return '-';
    const date = new Date(value);
    return Number.isNaN(date.getTime()) ? String(value) : date.toLocaleString('zh-CN',{hour12:false});
}

function closeOperationLogModal() {

}

function connectorPrefixes(connector) {
    if (Array.isArray(connector?.prefixes)) return connector.prefixes.map(String).map(value => value.trim()).filter(Boolean);
    return String(connector?.accountPrefix || connector?.account_prefix || '')
        .split(/[,，;；\s]+/).map(value => value.trim()).filter(Boolean);
}

function visibleConnectorPrefixes(connector) {
    return connectorPrefixes(connector);
}

function rebuildActiveConnectors() {
    activeConnectors = (db.bitConnectors || []).map(connector => {
        const heartbeat = connectorHeartbeatById.get(String(connector.id || ''));
        const lastSeen = heartbeat?.last_seen || connector.lastSeen || connector.last_seen || null;
        return { ...connector, lastSeen, last_seen:lastSeen };
    });
}

function renderBitIntegration() {
    const button = document.getElementById('bitLinkButton');
    const summary = document.getElementById('bitLinkSummary');
    const routeList = document.getElementById('bitRouteList');
    const jobList = document.getElementById('bitJobList');
    const searchInput = document.getElementById('bitJobSearchInput');
    const searchCount = document.getElementById('bitJobSearchCount');
    if (!button || !summary || !routeList || !jobList) return;

    const now = Date.now();
    bitConnectorRoutes = activeConnectors.map(connector => ({
        connector,
        prefixes:visibleConnectorPrefixes(connector)
    })).filter(item => item.prefixes.length).map(({ connector, prefixes }) => {
        const lastSeen = connector.lastSeen || connector.last_seen || null;
        const seenAt = lastSeen ? new Date(lastSeen).getTime() : 0;
        return {
            connector_id:connector.id,
            display_name:connector.displayName || connector.display_name || '未命名连接器',
            account_prefix:prefixes.join(','),
            last_seen:lastSeen,
            online:connector.enabled !== false && Number.isFinite(seenAt) && now - seenAt < BIT_CONNECTOR_OFFLINE_MS
        };
    });
    bitIntegrationAvailable = true;

    const tasks = [...(db.bitTasks || []).filter(task => isBitTaskInTargetScope(task))].sort((a,b) =>
        String(b.updatedAt || b.updated_at || '').localeCompare(String(a.updatedAt || a.updated_at || ''))
    );
    const searchValue = String(searchInput?.value || '').trim().toLowerCase();
    const taskViews = tasks.map(task => {
        const record = findBitTaskSourceRecord(task) || (task?.recordSnapshot && typeof task.recordSnapshot === 'object' ? task.recordSnapshot : null);
        const wechat = String(record?.wechat || task?.recordSnapshot?.wechat || '-');
        const status = String(task.status || '');
        const label = BIT_STATUS_LABELS[status] || status || '-';
        const rawTarget = task.targetWindowCount ?? task.target_window_count;
        const actionLabel = String(task.action || '') === BIT_WINDOW_QUOTA_ACTION && Number.isSafeInteger(Number(rawTarget))
            ? `修改窗口数为${Number(rawTarget)}`
            : (BIT_ACTION_LABELS[task.action] || task.action || '-');
        const updated = formatOperationTime(task.updatedAt || task.updated_at);
        const message = bitResultText(task);
        const searchable = [task.username,wechat,task.action,actionLabel,status,label,updated,task.attempts,
            message,task.resultCode,task.result_code,task.targetPrefix,record?.owner].join(' ').toLowerCase();
        return { task,wechat,status,label,actionLabel,updated,message,searchable };
    });
    const visibleTasks = searchValue
        ? taskViews.filter(view => view.searchable.includes(searchValue))
        : taskViews;
    if (searchCount) {
        searchCount.textContent = searchValue
            ? `（搜索结果 ${visibleTasks.length}/${tasks.length}）`
            : `（共 ${tasks.length} 条）`;
    }
    const pending = tasks.filter(task => BIT_PENDING_STATUSES.has(String(task.status || ''))).length;
    const attention = tasks.filter(task => String(task.status || '') === 'needs_attention').length;
    const online = bitConnectorRoutes.filter(route => route.online).length;

    button.classList.remove('ok','warn','error');
    if (bitIntegrationAvailable === false) {
        button.classList.add('error');
        button.textContent = '🔗 联动未初始化';
        summary.textContent = bitIntegrationMessage;
    } else if (attention > 0) {
        button.classList.add('error');
        button.textContent = `🔗 需处理 ${attention}`;
        summary.textContent = `有 ${attention} 个本归属任务需要人工处理，待执行/重试 ${pending} 个。`;
    } else if (online > 0) {
        button.classList.add('ok');
        button.textContent = `🔗 在线 ${online} · 待办 ${pending}`;
        summary.textContent = `${online}/${bitConnectorRoutes.length} 个连接器在线，任务每5秒刷新。`;
    } else {
        button.classList.add('warn');
        button.textContent = `🔗 离线 · 待办 ${pending}`;
        summary.textContent = bitConnectorRoutes.length
            ? '连接器当前离线，任务会保留等待程序上线。'
            : '尚未读取到已配置前缀的连接器。';
    }

    routeList.innerHTML = bitConnectorRoutes.length ? bitConnectorRoutes.map(route => {
        const seen = route.last_seen ? new Date(route.last_seen).toLocaleString('zh-CN',{hour12:false}) : '从未上线';
        return `<div class="bit-route ${route.online ? 'online' : 'offline'}">
            ${route.online ? '🟢' : '🔴'} ${escapeHtml(route.display_name)}　前缀：<b>${escapeHtml(route.account_prefix)}</b><br>
            <span style="color:#fff">最后心跳：${escapeHtml(seen)}</span>
        </div>`;
    }).join('') : '<div style="font-size:11px; color:#fff">暂无已配置前缀的连接器</div>';

    const rows = visibleTasks.slice(0,100).map(view => {
        const { task,wechat,status,label,actionLabel,updated,message } = view;
        return `<div class="bit-job-row">
            <div title="${escapeHtml(task.username || '-')}"><b>${escapeHtml(task.username || '-')}</b></div>
            <div title="${escapeHtml(wechat)}">${escapeHtml(wechat)}</div>
            <div>${escapeHtml(actionLabel)}</div>
            <div><span class="bit-badge ${escapeHtml(status)}">${escapeHtml(label)}</span></div>
            <div>${escapeHtml(updated)}</div>
            <div>${Number(task.attempts || 0)} 次</div>
            <div class="bit-job-message" title="${escapeHtml(message)}">${escapeHtml(message)}</div>
            <div>-</div>
        </div>`;
    }).join('');
    jobList.innerHTML = `<div class="bit-job-row bit-job-header"><div>员工号</div><div>微信</div><div>动作</div><div>状态</div><div>更新时间</div><div>尝试</div><div>结果/错误</div><div>操作</div></div>` +
        (rows || `<div style="text-align:center; padding:35px; color:#fff; font-size:13px;">${searchValue ? '没有找到匹配的联动任务' : '暂无当前归属的联动任务'}</div>`);
}

async function syncConnectors(silent = true) {
    if (_isSyncingConnectors) return;
    _isSyncingConnectors = true;
    try {
        const { data, error } = await supabaseClient.rpc('get_bit_connector_heartbeats');
        if (error) throw error;
        connectorHeartbeatById = new Map((data || []).map(row => [String(row.connector_id || ''),row]));
        rebuildActiveConnectors();
        renderBitIntegration();
    } catch (error) {
        console.error('[sync] 拉取连接器心跳失败:',error);
        rebuildActiveConnectors();
        renderBitIntegration();
        if (!silent) alert(`连接器心跳同步失败：\n${error?.message || error}`);
    } finally {
        _isSyncingConnectors = false;
    }
}

function openBitLinkModal() {
    document.getElementById('bitLinkModal').classList.add('open');
    renderBitIntegration();
    syncConnectors(false);
}

function closeBitLinkModal() {
    document.getElementById('bitLinkModal').classList.remove('open');
}

async function refreshBitLinkData() {
    await Promise.all([syncFromCloud(true),syncConnectors(false)]);
    rebuildActiveConnectors();
    renderBitIntegration();
}

async function ensureCloudInitializedForAction() {
    if (lastKnownUpdatedAt) return true;
    const deadline=Date.now()+30000;
    while (_isSyncing && Date.now()<deadline) await new Promise(resolve=>setTimeout(resolve,100));
    if (lastKnownUpdatedAt) return true;
    if (_hasPendingSave && !_isSaving) {
        clearTimeout(_saveTimer);_saveTimer=null;_hasPendingSave=false;_isSilentSave=false;
    }
    await syncFromCloud(false);
    if (lastKnownUpdatedAt) return true;
    alert('⚠️ 尚未完成云端初始化，本次操作没有执行。\n请检查网络后再试。');
    return false;
}

async function syncFromCloud(silent = false) {
    if (_isSyncing) {
        if (!silent) document.getElementById('syncStatus').innerText='☁️ 正在完成当前同步...';
        return;
    }
    if (_isSaving || _hasPendingSave) {
        if (!silent && !lastKnownUpdatedAt && !_isSaving) {
            clearTimeout(_saveTimer);_saveTimer=null;_hasPendingSave=false;_isSilentSave=false;
        } else {
            console.log('[sync] 正在保存或排队保存中，跳过此次同步');
            return;
        }
    }
    if (silent && document.querySelector('.edit-input')) {
        return;
    }
    _isSyncing = true;
    if (!silent) showLoading(true, { blocking:false });
    try {
        const { data, error } = await supabaseClient.from('MainData').select('content, updated_at').eq('id', ROW_ID).single();
        if (error) throw error;

        if (_isSaving || _hasPendingSave) {
            console.log('[sync] 请求期间发生本地修改，抛弃本次返回版本');
            if (!silent) showLoading(false);
            _isSyncing = false;
            return;
        }

        if (data && data.content) {
            lastKnownUpdatedAt = data.updated_at || 'FRESH';
            let parsed = data.content;
            if (typeof parsed === 'string') {
                try { parsed = JSON.parse(parsed); } catch(e) { parsed = {}; }
            }
            db = normalizeDb(parsed);
            rebuildActiveConnectors();
            baseSnapshot = snapshotMainData();
            localStorage.setItem(STORAGE_KEY, JSON.stringify(buildMainDataPayload()));
            render();
            const timeStr = getBeijingTime().toLocaleTimeString('zh-CN', {hour12:false});
            document.getElementById('syncStatus').innerText = `✅ 已同步 ${timeStr}`;
        }
    } catch (err) {
        console.error('[sync] 同步失败:', err);
        const local = localStorage.getItem(STORAGE_KEY);
        if (local) {
            try { db = normalizeDb(JSON.parse(local)); rebuildActiveConnectors(); render(); } catch(e) {}
        }
        document.getElementById('syncStatus').innerText = `❌ 同步失败`;
    }
    _isSyncing = false;
    if (!silent) showLoading(false);
}

function saveToCloud(silent = false) {
    _isSilentSave = _hasPendingSave ? (_isSilentSave && silent) : Boolean(silent);
    _saveRevision += 1;
    _hasPendingSave = true;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(buildMainDataPayload()));
    document.getElementById('syncStatus').innerText = "☁️ 等待上传...";
    scheduleCloudSave();
}

async function _doSaveToCloud() {
    if (_isSaving) {
        scheduleCloudSave(120);
        return;
    }
    if (!_hasPendingSave) return;
    const revisionAtStart = _saveRevision;
    const isSilent = _isSilentSave;
    const payload = snapshotMainData();
    _hasPendingSave = false;
    _isSilentSave = true;
    _isSaving = true;
    const statusEl = document.getElementById('syncStatus');
    statusEl.innerText = "☁️ 正在上传...";

    if (!lastKnownUpdatedAt) {
        if (!isSilent) alert("⚠️ 云端尚未初始化，本次修改未上传。\n系统将自动重新同步，同步完成后请重新操作。");
        statusEl.innerText = "☁️ 正在重新初始化...";
        clearTimeout(_saveTimer);_saveTimer=null;_hasPendingSave=false;_isSilentSave=false;
        _isSaving = false;
        setTimeout(()=>syncFromCloud(false),0);
        return;
    }

    const currentNow = new Date().toISOString();
    let conflictDetected = false;
    try {
        let opResult;
        if (lastKnownUpdatedAt === 'FRESH') {
            opResult = await supabaseClient.from('MainData').upsert({ id: ROW_ID, content: payload, updated_at: currentNow }).select();
        } else {
            opResult = await supabaseClient.from('MainData')
                .update({ content: payload, updated_at: currentNow })
                .eq('id', ROW_ID)
                .eq('updated_at', lastKnownUpdatedAt)
                .select();
        }
        if (opResult.error) throw opResult.error;

        if (lastKnownUpdatedAt !== 'FRESH' && (!opResult.data || opResult.data.length === 0)) {
            conflictDetected = true;
            _hasPendingSave = true;
            if (!isSilent) _isSilentSave = false;
            statusEl.innerHTML = `<span style="color:var(--warning);font-weight:bold;">☁️ 检测到多人同时操作，正在安全合并...</span>`;
            const resolved = await autoResolveConflict();
            if (!resolved && !_saveRetryTimer) {
                _saveRetryTimer = setTimeout(() => {
                    _saveRetryTimer = null;
                    if (_hasPendingSave && !_isSaving) _doSaveToCloud();
                }, 3000);
            }
            return;
        }

        lastKnownUpdatedAt = currentNow;
        baseSnapshot = snapshotMainData(payload);
        if (_saveRevision !== revisionAtStart) {
            _hasPendingSave = true;
            statusEl.innerText = "☁️ 前一批已保存，继续上传后续修改...";
        } else {
            const timeStr = getBeijingTime().toLocaleTimeString('zh-CN', {hour12:false});
            statusEl.innerText = `✅ 已同步 ${timeStr}`;
        }
        if (_saveRetryTimer) { clearTimeout(_saveRetryTimer); _saveRetryTimer = null; }
    } catch (err) {
        console.error('[save] 上传失败:', err);
        _hasPendingSave = true;
        if (!isSilent) _isSilentSave = false;
        statusEl.innerText = "⚠️ 网络失败，仅本地保存（待重试）";
        if (!_saveRetryTimer) {
            _saveRetryTimer = setTimeout(() => {
                _saveRetryTimer = null;
                if (_hasPendingSave && !_isSaving) _doSaveToCloud();
            }, 5000);
        }
    } finally {
        _isSaving = false;
        if (_hasPendingSave && !_saveRetryTimer && !conflictDetected) scheduleCloudSave(80);
    }
}

async function legacyAutoResolveConflict() {
    showLoading(true);
    let latestData = null;
    let latestUpdatedAt = null;
    try {
        const { data, error } = await supabaseClient.from('MainData').select('content, updated_at').eq('id', ROW_ID).single();
        if (error) throw error;
        if (data && data.content) {
            latestUpdatedAt = data.updated_at;
            let parsed = data.content;
            if (typeof parsed === 'string') { try { parsed = JSON.parse(parsed); } catch(e) { parsed = {}; } }
            latestData = { users: [], unused: [], trash: [], ...parsed };
        }
    } catch (err) {
        console.error("抓取最新数据合并失败", err);
        showLoading(false);
        alert("网络异常导致合并失败，请手动强制刷新！");
        return;
    }

    if (!baseSnapshot || !latestData) {
        console.warn("无有效基线快照，强制重载...");
        syncFromCloud(false);
        return;
    }

    const localData = { users: db.users, unused: db.unused, trash: db.trash };

    function isEqualItem(a, b) {
        if (!a && !b) return true;
        if (!a || !b) return false;
        const ka = Object.keys(a), kb = Object.keys(b);
        if (ka.length !== kb.length) return false;
        for (let k of ka) if (a[k] !== b[k]) return false;
        return true;
    }

    let hasActivationClash = false;

    function globallyMerge(baseObj, localObj, remoteObj) {
        function extractMap(dbObj) {
            const m = new Map();
            ['users','unused','trash'].forEach(listName => {
                for (let item of dbObj[listName] || []) {
                    m.set(item.id, { list: listName, data: item });
                }
            });
            return m;
        }

        const baseMap = extractMap(baseObj);
        const localMap = extractMap(localObj);
        const remoteMap = extractMap(remoteObj);
        const allIds = new Set([...baseMap.keys(), ...localMap.keys(), ...remoteMap.keys()]);
        const finalIds = new Map();

        for (let id of allIds) {
            const baseInfo = baseMap.get(id);
            const localInfo = localMap.get(id);
            const remoteInfo = remoteMap.get(id);

            const isLocalSame = isEqualItem(localInfo?.data, baseInfo?.data) && localInfo?.list === baseInfo?.list;
            const isRemoteSame = isEqualItem(remoteInfo?.data, baseInfo?.data) && remoteInfo?.list === baseInfo?.list;

            if (isLocalSame) {
                if (remoteInfo) finalIds.set(id, remoteInfo);
            } else if (isRemoteSame) {
                if (localInfo) finalIds.set(id, localInfo);
            } else {
                if (baseInfo?.list === 'unused' && localInfo?.list === 'users' && remoteInfo?.list === 'users') {
                    hasActivationClash = true;
                    if (remoteInfo) finalIds.set(id, remoteInfo);
                } else {
                    if (localInfo) finalIds.set(id, localInfo);
                }
            }
        }

        const newDb = { users: [], unused: [], trash: [] };
        ['users','unused','trash'].forEach(listName => {
            const added = new Set();
            for (let item of localObj[listName] || []) {
                const finalInfo = finalIds.get(item.id);
                if (finalInfo && finalInfo.list === listName) {
                    newDb[listName].push(finalInfo.data);
                    added.add(item.id);
                }
            }
            for (let item of remoteObj[listName] || []) {
                const finalInfo = finalIds.get(item.id);
                if (finalInfo && finalInfo.list === listName && !added.has(item.id)) {
                    newDb[listName].push(finalInfo.data);
                }
            }
        });
        return newDb;
    }

    const mergedDb = globallyMerge(baseSnapshot, localData, latestData);

    if (hasActivationClash) {
        alert("⚠️ 手慢无提示！\n\n您刚刚尝试激活的名额，已被其他同事抢先一步激活！\n为防止生成重复记录，您本次的激活操作已被拦截取消。\n\n系统已自动为您重新拉取最新的名额分配状态。");
        showLoading(false);
        document.getElementById('syncStatus').innerHTML = `<span style="color:var(--danger); font-weight:bold;">❌ 激活手慢冲突</span>`;
        db.users = latestData.users;
        db.unused = latestData.unused;
        db.trash = latestData.trash;
        baseSnapshot = JSON.parse(JSON.stringify(db));
        lastKnownUpdatedAt = latestUpdatedAt;
        render();
        return;
    }

    db.users = mergedDb.users;
    db.unused = mergedDb.unused;
    db.trash = mergedDb.trash;
    
    baseSnapshot = JSON.parse(JSON.stringify(db));
    lastKnownUpdatedAt = latestUpdatedAt;
    
    setTimeout(() => {
        _hasPendingSave = true;
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ users: db.users, unused: db.unused, trash: db.trash }));
        _doSaveToCloud();
    }, 50);

    render();
    showLoading(false);
    
    document.getElementById('syncStatus').innerHTML = `<span style="color:var(--success); font-weight:bold;">✅ 已自动合并更改</span>`;
}

async function autoResolveConflict() {
    showLoading(true, { blocking:false });
    let latestData = null;
    let latestUpdatedAt = null;
    try {
        const { data, error } = await supabaseClient.from('MainData').select('content, updated_at').eq('id', ROW_ID).single();
        if (error) throw error;
        if (data && data.content) {
            latestUpdatedAt = data.updated_at;
            latestData = normalizeDb(data.content);
        }
    } catch (err) {
        console.error('抓取最新数据合并失败', err);
        showLoading(false);
        document.getElementById('syncStatus').innerText = '⚠️ 合并失败，本地修改已保留，稍后自动重试';
        return false;
    }

    if (!baseSnapshot || !latestData || !latestUpdatedAt) {
        showLoading(false);
        document.getElementById('syncStatus').innerText = '⚠️ 缺少合并基线，本地修改已保留';
        return false;
    }

    const localData = snapshotMainData();
    let hasActivationClash = false;
    const fieldConflicts = [];
    const fieldLabels = { windows:'窗口数', password:'密码', wechat:'微信', expiry:'到期日期' };
    const discardedLocalTaskIds = new Set();
    const MISSING = Symbol('missing');

    const valueOf = (obj, key) => Object.prototype.hasOwnProperty.call(obj || {}, key) ? obj[key] : MISSING;
    const sameValue = (a, b) => {
        if (a === MISSING || b === MISSING) return a === b;
        return JSON.stringify(a) === JSON.stringify(b);
    };
    const sameItem = (a, b) => {
        if (!a || !b) return a === b;
        return sameValue(a, b);
    };
    const activeQuotaTask = (source, record) => {
        const task = (source.bitTasks || []).find(item => String(item.id) === String(record?.windowJobId || ''));
        return task && task.action === BIT_WINDOW_QUOTA_ACTION && BIT_WINDOW_ACTIVE_STATUSES.has(String(task.status || '')) ? task : null;
    };

    function mergeRecordFields(baseRecord, localRecord, remoteRecord) {
        const result = {};
        const keys = new Set([
            ...Object.keys(baseRecord || {}),
            ...Object.keys(localRecord || {}),
            ...Object.keys(remoteRecord || {})
        ]);
        for (const key of keys) {
            const baseValue = valueOf(baseRecord, key);
            const localValue = valueOf(localRecord, key);
            const remoteValue = valueOf(remoteRecord, key);
            const localChanged = !sameValue(localValue, baseValue);
            const remoteChanged = !sameValue(remoteValue, baseValue);
            let chosen;
            if (localChanged && remoteChanged && !sameValue(localValue, remoteValue)) {
                const localQuota = key === 'windows' ? activeQuotaTask(localData, localRecord) : null;
                const remoteQuota = key === 'windows' ? activeQuotaTask(latestData, remoteRecord) : null;
                chosen = localQuota && !remoteQuota ? localValue : remoteValue;
                if (localQuota && remoteQuota && String(localQuota.id) !== String(remoteQuota.id)) discardedLocalTaskIds.add(String(localQuota.id));
                if (fieldLabels[key] && !(key === 'windows' && localQuota && !remoteQuota)) {
                    fieldConflicts.push({
                        username: remoteRecord?.username || localRecord?.username || '-',
                        field: fieldLabels[key]
                    });
                }
            } else if (localChanged) {
                chosen = localValue;
            } else {
                chosen = remoteValue;
            }
            if (chosen !== MISSING) result[key] = chosen;
        }
        return result;
    }

    function extractMap(source) {
        const map = new Map();
        for (const listName of ['users','unused','trash']) {
            for (const item of source[listName] || []) {
                if (item?.id) map.set(String(item.id), { list:listName, data:item });
            }
        }
        return map;
    }

    const baseMap = extractMap(baseSnapshot);
    const localMap = extractMap(localData);
    const remoteMap = extractMap(latestData);
    const finalIds = new Map();
    const allIds = new Set([...baseMap.keys(), ...localMap.keys(), ...remoteMap.keys()]);
    for (const id of allIds) {
        const baseInfo = baseMap.get(id);
        const localInfo = localMap.get(id);
        const remoteInfo = remoteMap.get(id);
        const localSame = sameItem(localInfo?.data, baseInfo?.data) && localInfo?.list === baseInfo?.list;
        const remoteSame = sameItem(remoteInfo?.data, baseInfo?.data) && remoteInfo?.list === baseInfo?.list;
        if (localSame) {
            if (remoteInfo) finalIds.set(id, remoteInfo);
        } else if (remoteSame) {
            if (localInfo) finalIds.set(id, localInfo);
        } else if (baseInfo?.list === 'unused' && localInfo?.list === 'users' && remoteInfo?.list === 'users') {
            hasActivationClash = true;
            if (remoteInfo) finalIds.set(id, remoteInfo);
        } else if (localInfo && remoteInfo && localInfo.list === remoteInfo.list) {
            finalIds.set(id, {
                list: localInfo.list,
                data: mergeRecordFields(baseInfo?.data || {}, localInfo.data, remoteInfo.data)
            });
        } else if (localInfo) {
            finalIds.set(id, localInfo);
        } else if (remoteInfo) {
            finalIds.set(id, remoteInfo);
        }
    }

    const mergedDb = normalizeDb({});
    for (const listName of ['users','unused','trash']) {
        const added = new Set();
        for (const item of localData[listName] || []) {
            const finalInfo = finalIds.get(String(item.id));
            if (finalInfo?.list === listName) {
                mergedDb[listName].push(finalInfo.data);
                added.add(String(item.id));
            }
        }
        for (const item of latestData[listName] || []) {
            const id = String(item.id);
            const finalInfo = finalIds.get(id);
            if (finalInfo?.list === listName && !added.has(id)) mergedDb[listName].push(finalInfo.data);
        }
    }
    const taskMap = new Map();
    for (const task of [...(latestData.bitTasks || []), ...(localData.bitTasks || [])]) {
        if (!task?.id || discardedLocalTaskIds.has(String(task.id))) continue;
        const key = String(task.id);
        const existing = taskMap.get(key);
        if (!existing || String(task.updatedAt || '') >= String(existing.updatedAt || '')) taskMap.set(key, task);
    }
    mergedDb.bitTasks = [...taskMap.values()];
    const baseOperationLogIds = new Set((baseSnapshot.operationLogs || []).map(log => String(log?.id || '')).filter(Boolean));
    const localOperationLogIds = new Set((localData.operationLogs || []).map(log => String(log?.id || '')).filter(Boolean));
    const remoteOperationLogIds = new Set((latestData.operationLogs || []).map(log => String(log?.id || '')).filter(Boolean));
    const deletedOperationLogIds = new Set([
        ...[...baseOperationLogIds].filter(id => !localOperationLogIds.has(id)),
        ...[...baseOperationLogIds].filter(id => !remoteOperationLogIds.has(id))
    ]);
    const operationLogMap = new Map();
    for (const log of [...(latestData.operationLogs || []), ...(localData.operationLogs || [])]) {
        if (!log?.id) continue;
        const key = String(log.id);
        if (deletedOperationLogIds.has(key)) continue;
        const existing = operationLogMap.get(key);
        if (!existing || String(log.operatedAt || '') >= String(existing.operatedAt || '')) operationLogMap.set(key, log);
    }
    mergedDb.operationLogs = [...operationLogMap.values()];
    mergedDb.bitConnectors = latestData.bitConnectors || [];
    mergedDb.bitInventory = latestData.bitInventory || [];
    mergedDb.bitUsernameRegistry = latestData.bitUsernameRegistry || [];

    if (hasActivationClash) {
        db = latestData;
        baseSnapshot = snapshotMainData(latestData);
        lastKnownUpdatedAt = latestUpdatedAt;
        _hasPendingSave = false;
        render();
        showLoading(false);
        alert('⚠️ 该待激活名额已被其他用户抢先激活，本次操作没有覆盖云端数据。页面已刷新到最新状态。');
        return true;
    }

    db = mergedDb;
    baseSnapshot = snapshotMainData(latestData);
    lastKnownUpdatedAt = latestUpdatedAt;
    saveToCloud(true);
    render();
    showLoading(false);

    if (fieldConflicts.length) {
        const unique = [...new Set(fieldConflicts.map(item => `${item.username}：${item.field}`))];
        alert(`⚠️ 检测到其他用户同时修改同一资料：\n\n${unique.join('\n')}\n\n云端先保存的值已保留，本页面没有静默覆盖。其他不冲突的修改仍会继续保存。`);
    }
    document.getElementById('syncStatus').innerText = '☁️ 多人修改已安全合并，正在重新上传...';
    return true;
}

function render() {
    const container = document.getElementById('userTableBody');
    let displayData = db.users.filter(isTargetOwnerRecord);
    
    const filters = {};
    document.querySelectorAll('.col-filter').forEach(i => { if(i.value) filters[i.dataset.col] = i.value.toLowerCase(); });

    displayData = displayData.filter(u => {
        const statusMatch = currentFilter === 'all' || getStatus(u.expiry) === currentFilter;
        const columnMatch = Object.keys(filters).every(key => String(u[key] || '-').toLowerCase().includes(filters[key]));
        return statusMatch && columnMatch;
    });

    displayData.sort((a,b) => {
        if (a.isStarred && !b.isStarred) return -1;
        if (!a.isStarred && b.isStarred) return 1;
        if (a.id === newlyActivatedId) return -1;
        if (b.id === newlyActivatedId) return 1;
        return new Date(a.expiry) - new Date(b.expiry);
    });

    document.getElementById('statWindows').innerText = `/ ${displayData.reduce((s, u) => s + parseInt(u.windows || 0), 0)}`;

            <td><b>${u.username}</b></td>
            <td data-f="password">${u.password || DEFAULT_PWD}</td>

            </td>
        `;

async function renewFromTrash(id) {
    const operationClickedAt = new Date().toISOString();
    if (!(await ensureCloudInitializedForAction())) return;
    const index = db.trash.findIndex(item => String(item.id) === String(id) && isTargetOwnerRecord(item));
    if (index < 0) return alert('该账号不在当前归属的回收站中，请刷新后重试。');
    const record = db.trash[index];
    const expiryBefore = String(record.expiry || '');
    if (!confirm(`确定为“${record.username}”续费30天并恢复 BitBrowser 员工号？`)) return;
    try {
        const newExpiry = renewedExpiryForTrash(record);
        enqueueRestrictedLifecycleTask(record, 'recover');
        db.trash.splice(index,1);
        record.expiry = newExpiry;
        delete record.operated;
        delete record._bitPendingRecoverKey;
        db.users.push(record);
        recordOperationLog(record, 'renew', { operatedAt:operationClickedAt, expiryBefore, expiryAfter:newExpiry });
        saveToCloud();
        renderTrash();
        render();
    } catch (error) {
        alert(`❌ 续费恢复失败：\n${error?.message || error}`);
    }
}

async function activate(id) {
    const operationClickedAt = new Date().toISOString();
    if (!(await ensureCloudInitializedForAction())) return;
    const u = db.unused.find(x => x.id === id);
    if(!u) return;
    const now = getBeijingTime();
    const activeTime = now.toISOString().slice(0,10);
    now.setMonth(now.getMonth() + 1);
    newlyActivatedId = id;
    const activatedUser = { 
        id: id, 
        username: u.username, 
        password: u.password, 
        owner: TARGET_ORG, 
        wechat: '-', 
        amount: DEFAULT_AMOUNT, 
        windows: DEFAULT_WINDOWS, 
        activeTime, 
        expiry: now.toISOString().slice(0,10), 
        isStarred: false 
    };
    db.users.push(activatedUser);
    db.unused = db.unused.filter(x => x.id !== id);
    recordOperationLog(activatedUser, 'activate', { operatedAt:operationClickedAt, expiryAfter:activatedUser.expiry });
    saveToCloud(); render();
}

async function quickRenew(id) {
    const operationClickedAt = new Date().toISOString();
    if (!(await ensureCloudInitializedForAction())) return;
    const u = db.users.find(x => x.id === id);
    if (!u) return;
    const expiryBefore = String(u.expiry || '');
    let d = new Date(u.expiry);
    if (d < getBeijingTime()) d = getBeijingTime();
    d.setDate(d.getDate() + 30);
    u.expiry = d.toISOString().slice(0, 10);
    recordOperationLog(u, 'renew', { operatedAt:operationClickedAt, expiryBefore, expiryAfter:u.expiry });
    saveToCloud(); render();
}

function makeEditable(el, id, field) {
    if (!['windows', 'password', 'wechat'].includes(field)) return;
    const oldVal = el.innerText === '-' ? '' : el.innerText;
    const input = document.createElement('input');
    input.className = 'edit-input';
    input.value = oldVal;
    el.innerHTML = ''; el.appendChild(input); input.focus();
    input.onblur = () => {
      if (input._saved) return;
      input._saved = true;
      const u = db.users.find(x => x.id === id);
      if(u) {
        const rawValue = input.value.trim();
        if (field === 'windows') {
            if (!/^\d+$/.test(rawValue) || !Number.isSafeInteger(Number(rawValue))) {
                alert('❌ 窗口数必须是大于等于 0 的整数。');
                render();
                return;
            }
            const target = Number(rawValue);
            u.windows = target;
            u.windowTarget = target;
            if (Number(u.bitWindowQuota) !== target) enqueueWindowQuotaTask(u, target);
        } else {
            u[field] = rawValue || '-';
        }
        saveToCloud();
      }
      render();
    };
    input.onkeydown = (e) => { if(e.key==='Enter') input.blur(); };
}
